language: 'python'

fileGroups:
  sources:
    - 'authdog/**/*'
  tests:
    - 'tests/**/*'
  configs:
    - 'pyproject.toml'
    - 'uv.lock'

tasks:
  deps:
    command: 'uv sync --frozen'
    inputs:
      - '@group(configs)'
    options:
      cache: false

  test:
    command: 'uv run python -m pytest --cov=authdog --cov-report=xml --cov-report=term-missing'
    deps:
      - '~:deps'
    inputs:
      - '@group(sources)'
      - '@group(tests)'
      - '@group(configs)'
    outputs:
      - 'coverage.xml'

  lint:
    command: 'uv run python -m flake8 authdog/ --count --select=E9,F63,F7,F82 --show-source --statistics'
    deps:
      - '~:deps'
    inputs:
      - '@group(sources)'

  build:
    command: 'uv run python -m build'
    deps:
      - '~:deps'
    inputs:
      - '@group(sources)'
      - '@group(configs)'
    outputs:
      - 'dist/'
