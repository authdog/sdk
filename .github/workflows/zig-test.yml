name: Zig SDK Tests

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
    paths:
      - 'zig/**'
      - '.github/workflows/zig-test.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'zig/**'
      - '.github/workflows/zig-test.yml'

jobs:
  test:
    name: Test Zig SDK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Zig 0.16.0
      uses: mlugg/setup-zig@v2
      with:
        version: '0.16.0'

    - name: Setup Moon + Proto
      uses: ./.github/actions/setup-moon

    - name: Check formatting
      run: moon run zig:fmt

    - name: Run tests
      run: moon run zig:test

    - name: Build library
      run: moon run zig:build

    - name: Generate documentation
      run: moon run zig:doc
