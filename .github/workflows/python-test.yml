name: Python SDK Tests

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish authdog to PyPI
        type: boolean
        default: false
  release:
    types: [published]
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
      - 'python-v*'
    paths:
      - 'python/**'
      - '.github/workflows/python-test.yml'
      - '.moon/workspace.yml'
      - '.moon/toolchain.yml'
      - '.prototools'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'python/**'
      - '.github/workflows/python-test.yml'
      - '.moon/workspace.yml'
      - '.moon/toolchain.yml'
      - '.prototools'

jobs:
  test:
    name: Test Python SDK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Moon + Proto
      uses: ./.github/actions/setup-moon

    - name: Install dependencies
      run: moon run python:deps

    - name: Run linting
      run: moon run python:lint

    - name: Run tests
      run: moon run python:test

    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: python-coverage
        path: python/coverage.xml

  build:
    name: Build Python SDK
    needs: [test]
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Moon + Proto
      uses: ./.github/actions/setup-moon

    - name: Build package
      run: moon run python:build

    - name: Publish authdog to PyPI
      if: github.event_name == 'workflow_dispatch' && inputs.publish
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: python/dist/
        password: ${{ secrets.PYPI_TOKEN }}
        skip-existing: true

    - name: Upload distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: python/dist/
